name: Build Eigen – WebAssembly (Debug)

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}
  release:
    types: [created]

permissions:
  contents: write
  actions: read

concurrency:
  group: build-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      # -----------------------------
      # Checkout repository + submodules
      # -----------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -----------------------------
      # Cache Emscripten SDK
      # -----------------------------
      - name: Cache emsdk
        id: emsdk-cache
        uses: actions/cache@v4
        with:
          path: |
            emsdk/
            ~/.emscripten_cache
          key: emsdk-${{ runner.os }}-${{ hashFiles('**/*.cmake','**/CMakeLists.txt') }}
          restore-keys: |
            emsdk-${{ runner.os }}-

      # -----------------------------
      # Install Emscripten SDK
      # -----------------------------
      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -x
          echo "[DEBUG] Current dir: $(pwd)"
          env | sort

          if [ ! -d "emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git emsdk
          fi

          cd emsdk
          echo "[DEBUG] emsdk directory contents:"; ls -al

          ./emsdk install latest
          ./emsdk activate latest

          # Manual sourcing during same step
          source ./emsdk_env.sh
          echo "[DEBUG] After manual sourcing:"; env | sort
          emcc --version

          echo "[DEBUG] After activation:"; ls -al
          echo "[DEBUG] emsdk_env.sh:"; head -n 50 emsdk_env.sh || true

          # --- CRITICAL DEBUGGING: what is written to GITHUB_ENV? ---
          echo "EMSDK=$(pwd)" >> $GITHUB_ENV
          echo "source $(pwd)/emsdk_env.sh" >> $GITHUB_ENV

          echo "[DEBUG] Contents of GITHUB_ENV after writing:"; cat $GITHUB_ENV

      # ------------------------------------------------
      # Cache build directory (optional incremental builds)
      # ------------------------------------------------
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build/
          key: build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-

      # ------------------------------------------------
      # Build Eigen WASM
      # ------------------------------------------------
      - name: Configure & Build with CMake
        shell: bash
        run: |
          set -x
          echo "[DEBUG] Before sourcing in build step:"; env | sort
          echo "[DEBUG] GITHUB_ENV:"; cat $GITHUB_ENV || true

          source $EMSDK/emsdk_env.sh
          echo "[DEBUG] After sourcing emsdk_env.sh:"; env | sort

          mkdir -p build
          cd build

          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
          emmake make -j$(nproc || sysctl -n hw.ncpu)

      - name: Show build output
        run: ls -R build || true

      # ------------------------------------------------
      # Upload as CI Artifact
      # ------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: eigen-wasm-${{ matrix.os }}
          path: build/

      # ------------------------------------------------
      # Attach to GitHub Release (tag builds)
      # ------------------------------------------------
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/**/*.wasm
            build/**/*.js
            build/**/*.data
            build/**/*.html
