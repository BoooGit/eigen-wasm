name: Build Eigen ? WebAssembly

# triggers: on push to main, on tag, and manual dispatch
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}    # allows manual runs from Actions UI
  release:
    types: [created]

permissions:
  contents: read            # needed to checkout code & submodules
  actions: read

concurrency:
  group: build-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build WASM (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up cache for emsdk
        uses: actions/cache@v4
        id: emsdk-cache
        with:
          path: ~/.emsdk
          key: emsdk-cache-v1-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt','**/src/**') }}
          restore-keys: |
            emsdk-cache-v1-${{ runner.os }}-

      - name: Install Emscripten SDK (emsdk)
        run: |
          git clone https://github.com/emscripten-core/emsdk.git ~/emsdk
          cd ~/emsdk
          ./emsdk install latest
          ./emsdk activate latest
          echo "source ~/emsdk/emsdk_env.sh" >> $GITHUB_ENV

      - name: Configure environment
        run: |
          source ~/emsdk/emsdk_env.sh
          emcc --version

      - name: Build with CMake + Emscripten
        run: |
          source ~/emsdk/emsdk_env.sh
          mkdir -p build
          cd build
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release
          emmake make -j$(nproc)
        working-directory: ${{ github.workspace }}

      - name: List build artifacts
        run: ls -la build || true

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: eigen-wasm-build
          path: build/
          retention-days: 30
